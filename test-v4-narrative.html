let S={};
function $(id){return document.getElementById(id)}
function pick(key){const a=D[key];if(!Array.isArray(a)||!a.length)throw new Error("Table introuvable : "+key);return a[Math.floor(Math.random()*a.length)]}
function other(key,current){const a=D[key];if(!Array.isArray(a)||!a.length)throw new Error("Table introuvable : "+key);if(a.length<2)return a[0];let v=current;let n=0;while(v===current&&n<20){v=pick(key);n++}return v}
function esc(v){return String(v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lc(v){return String(v).charAt(0).toLowerCase()+String(v).slice(1)}
function newBlocks(){S.ant={nature:pick('nature'),fonction:pick('fonction'),faction:pick('faction'),rapport:pick('rapport'),objectif:pick('objectif'),motivation:pick('motivation'),power:pick('power'),technique:pick('technique'),knowledge:pick('knowledge'),particularity:pick('particularity')};S.obj={nature:pick('objectNature'),origin:pick('objectOrigin'),fonction:pick('objectFunction'),link:pick('objectFunction'),manifestation:pick('manifestation')};S.char={nature:pick('charNature'),fonction:pick('charFunction'),position:pick('charPosition'),objectif:pick('charObjective'),motivation:pick('charMotivation'),info:pick('charInfo'),secret:pick('charSecret')};S.third={nature:pick('thirdNature'),role:pick('thirdRole'),objectif:pick('thirdObj'),motivation:pick('thirdMot')};}
function generateScenario(){S={mission:pick('mission'),situation:pick('situation'),friction:pick('friction'),reveal:pick('reveal'),res:{type:pick('resType'),objective:pick('resObj'),stakes:pick('stakes')},event:{type:pick('eventType'),text:pick('event')},loc:{nature:pick('location'),fonction:pick('locationFunction'),feature:pick('locationFeature')}};newBlocks();render();$('result').classList.remove('hidden')}
function opt(){let d=+$('duration').value;return{event:d>=3,reveal:d>=4,third:d>=4}}
function makeTitle(){let g=$('genre').value;if(g==='Horreur')return'La présence';if(g==='Enquête')return'Les traces du dossier';if(g==='Exploration / Découverte / Lore')return'Les traces de l’ancien monde';if(g==='Social / Éthique / Dilemme')return'Le prix du choix';if(g==='Poétique / Étrange')return'Ce qui demeure de l’autre côté';if(g==='Thriller / Course contre la montre')return'Avant que tout bascule';return'Dossier A.E.G.I.S.'}
function row(label,val,fn,opt=false){let d=document.createElement('div');d.className='row'+(opt?' optional':'');let n=document.createElement('div');n.className='name';n.innerHTML=esc(label)+(opt?' <span class="tag">OPTIONNEL</span>':'');let v=document.createElement('div');v.className='value';v.textContent=val;let b=document.createElement('button');b.className='reroll';b.textContent='↻';b.onclick=fn;d.append(n,v,b);return d}
function section(title,id,rows,opt=false){let s=document.createElement('div');s.className='section'+(opt?' optional':'');let hd=document.createElement('div');hd.className='sectionHead';let h=document.createElement('h3');h.innerHTML=esc(title)+(opt?' <span class="tag">OPTIONNEL</span>':'');let b=document.createElement('button');b.className='block';b.textContent='↻ Reroll du bloc';b.onclick=()=>rerollBlock(id);hd.append(h,b);s.append(hd);rows.forEach(r=>s.append(r));return s}
function rf(block,field){if(block==='ant')S.ant[field]=other(field,S.ant[field]);else if(block==='obj'){let m={nature:'objectNature',origin:'objectOrigin',fonction:'objectFunction',link:'objectFunction',manifestation:'manifestation'};S.obj[field]=other(m[field],S.obj[field])}else if(block==='char'){let m={nature:'charNature',fonction:'charFunction',position:'charPosition',objectif:'charObjective',motivation:'charMotivation',info:'charInfo',secret:'charSecret'};S.char[field]=other(m[field],S.char[field])}else if(block==='third'){let m={nature:'thirdNature',role:'thirdRole',objectif:'thirdObj',motivation:'thirdMot'};S.third[field]=other(m[field],S.third[field])}else if(block==='loc'){let m={nature:'location',fonction:'locationFunction',feature:'locationFeature'};S.loc[field]=other(m[field],S.loc[field])}else if(block==='res'){let m={type:'resType',objective:'resObj',stakes:'stakes'};S.res[field]=other(m[field],S.res[field])}else if(block==='event'){let m={type:'eventType',text:'event'};S.event[field]=other(m[field],S.event[field])}else{S[block]=other(block,S[block])}render()}
function rerollBlock(id){if(id==='ant'){S.ant={nature:pick('nature'),fonction:pick('fonction'),faction:pick('faction'),rapport:pick('rapport'),objectif:pick('objectif'),motivation:pick('motivation'),power:pick('power'),technique:pick('technique'),knowledge:pick('knowledge'),particularity:pick('particularity')}}if(id==='obj'){S.obj={nature:pick('objectNature'),origin:pick('objectOrigin'),fonction:pick('objectFunction'),link:pick('objectFunction'),manifestation:pick('manifestation')}}if(id==='char'){S.char={nature:pick('charNature'),fonction:pick('charFunction'),position:pick('charPosition'),objectif:pick('charObjective'),motivation:pick('charMotivation'),info:pick('charInfo'),secret:pick('charSecret')}}if(id==='third'){S.third={nature:pick('thirdNature'),role:pick('thirdRole'),objectif:pick('thirdObj'),motivation:pick('thirdMot')}}render()}
function render(){
  const o=opt(), r=$('rows');
  r.innerHTML='';
  $('title').textContent=makeTitle();
  $('meta').textContent=`${$('agents').value} agents · ${$('duration').value} h · ${$('genre').value}`;
  const mapRows=(obj,block,defs)=>defs.map(x=>row(x[1],obj[x[0]],()=>rf(block,x[0])));
  r.append(section('Cadre de mission',null,[row('Nature de la mission',S.mission,()=>rf('mission')),row('Situation de départ',S.situation,()=>rf('situation')),row('Lieu — nature',S.loc.nature,()=>rf('loc','nature')),row('Lieu — fonction',S.loc.fonction,()=>rf('loc','fonction')),row('Lieu — caractéristique',S.loc.feature,()=>rf('loc','feature'))]));
  r.append(section('Antagoniste principal','ant',mapRows(S.ant,'ant',[['nature','Nature'],['fonction','Fonction'],['faction','Faction'],['rapport','Rapport à la faction'],['objectif','Objectif'],['motivation','Motivation'],['power','Pouvoir / capacité'],['technique','Technique utile'],['knowledge','Connaissance utile'],['particularity','Particularité']])));
  r.append(section('Artefact / phénomène / objet','obj',mapRows(S.obj,'obj',[['nature','Nature'],['origin','Origine'],['fonction','Fonction'],['link','Lien avec l’affaire'],['manifestation','Manifestation']])));
  r.append(section('Personnage clé','char',mapRows(S.char,'char',[['nature','Nature'],['fonction','Fonction'],['position','Position dans le conflit'],['objectif','Objectif'],['motivation','Motivation'],['info','Information détenue'],['secret','Secret éventuel']])));
  r.append(section('Friction / contrainte opérationnelle',null,[row('Contrainte',S.friction,()=>rf('friction'))]));
  r.append(section('Révélation',null,[row('Révélation',S.reveal,()=>rf('reveal'))],!o.reveal));
  r.append(section('Résolution / enjeu final',null,[row('Type',S.res.type,()=>rf('res','type')),row('Objectif final',S.res.objective,()=>rf('res','objective')),row('Enjeu',S.res.stakes,()=>rf('res','stakes'))]));
  r.append(section('Intervenant tiers','third',mapRows(S.third,'third',[['nature','Nature'],['role','Rôle dans le conflit'],['objectif','Objectif'],['motivation','Motivation']]),!o.third));
  r.append(section('Événement intermédiaire','event',[row('Type',S.event.type,()=>rf('event','type')),row('Événement',S.event.text,()=>rf('event','text'))],!o.event));
  $('story').innerHTML=story();
}
function tone(){let g=$('genre').value;return g==='Horreur'?"La situation donne rapidement l’impression que le phénomène observe les agents.":g==='Enquête'?"Les premiers faits paraissent contradictoires, mais leur répétition dessine une logique.":g==='Exploration / Découverte / Lore'?"Chaque découverte ajoute une pièce à une histoire plus ancienne que l’intervention.":g==='Social / Éthique / Dilemme'?"Le danger ne suffit pas à désigner un camp : plusieurs intérêts peuvent être légitimes et incompatibles.":g==='Poétique / Étrange'?"L’affaire conserve une part d’étrangeté que les agents ne peuvent pas entièrement réduire à une explication rationnelle.":g==='Survie'?"Le terrain impose de rester opérationnel avant toute autre considération.":g==='Thriller / Course contre la montre'?"Le temps réduit progressivement la marge de manœuvre des agents.":"La situation privilégie l’action, les déplacements et les confrontations directes."}
function story(){let a=S.ant,o=S.obj,c=S.char,l=S.loc,x=S.res,t=S.third,e=S.event,p=`<h3>Situation et mandat</h3><p>A.E.G.I.S. déploie ${$('agents').value} agents pour ${lc(S.mission)} ${S.situation} ${tone()}</p>`;p+=`<h3>Ce qui se joue réellement</h3><p>La force opposée est ${lc(a.nature)}, qui agit comme ${lc(a.fonction)}. ${a.faction} : ${lc(a.rapport)} Son objectif est de ${lc(a.objectif)}, motivé par ${lc(a.motivation)}. L’affaire tourne autour de ${lc(o.nature)}, d’origine ${lc(o.origin)}, dont la fonction est de ${lc(o.fonction)}.</p>`;p+=`<h3>Terrain et acteurs</h3><p>Le dossier conduit les agents vers ${lc(l.nature)}. Le lieu sert de ${lc(l.fonction)} et ${lc(l.feature)} ${lc(c.nature)} intervient comme ${lc(c.fonction)} ; sa position est ${lc(c.position)}. Son objectif est de ${lc(c.objectif)}, motivé par ${lc(c.motivation)}.</p>`;p+=`<h3>Confrontation</h3><p>La progression est compliquée par ${lc(S.friction)}. L’antagoniste dispose de ${lc(a.power)} et privilégie ${lc(a.technique)}. Il connaît ${lc(a.knowledge)}. Sa particularité est la suivante : ${lc(a.particularity)}.</p>`;let oo=opt();p+=`<h3>Résolution</h3><p>La situation doit finalement prendre la forme d’une ${x.type.toLowerCase()} : les agents doivent ${lc(x.objective)}. L’enjeu porte sur ${lc(x.stakes)}.</p>`;p+=`<h3${oo.reveal?'':' class="optional"'}>Révélation${oo.reveal?'':' — OPTIONNEL'}</h3><p${oo.reveal?'':' class="optional"'}>${S.reveal}</p>`;p+=`<h3${oo.third?'':' class="optional"'}>Intervenant tiers${oo.third?'':' — OPTIONNEL'}</h3><p${oo.third?'':' class="optional"'}>${c?`${t.nature} : ${t.role} Son objectif est de ${lc(t.objectif)}, pour ${lc(t.motivation)}.`:''}</p>`;p+=`<h3${oo.event?'':' class="optional"'}>Événement intermédiaire${oo.event?'':' — OPTIONNEL'}</h3><p${oo.event?'':' class="optional"'}>${e.type} : ${e.text} Cet événement ne doit pas être nécessaire à la résolution, mais peut laisser un petit effet, un objet ou un écho jusqu’à la fin.</p>`;return p}
window.generateScenario=generateScenario;
window.runGenerator=function(){var result=document.getElementById('result');var storyBox=document.getElementById('story');try{generateScenario();result.classList.remove('hidden');}catch(err){result.classList.remove('hidden');storyBox.innerHTML='<h3>Erreur de génération</h3><p>'+esc(err && err.message ? err.message : String(err))+'</p>';}};
function developmentPrompt(billet){return `Tu es auteur et concepteur de scénarios pour A.E.G.I.S., un jeu de rôle d'action surnaturelle.

À partir du billet opérationnel fourni à la fin de ce message, transforme ce matériau en un scénario complet, cohérent et directement exploitable par un meneur de jeu.

Le billet est le socle du scénario : développe, structure et enrichis ce qui existe, sans repartir de zéro.

RÈGLES DE CONSERVATION
- Conserve la mission, le nombre d'agents, la durée et la tonalité.
- Conserve les éléments établis concernant antagonistes, objectifs, motivations, pouvoirs, limites et particularités.
- Conserve artefacts, phénomènes, objets, origines, fonctions et rôles.
- Conserve lieux, personnages, factions, intervenants et enjeux.
- Ne supprime pas un élément parce qu'il est inhabituel.
- Ne transforme jamais un élément OPTIONNEL en condition de victoire.
- Ne crée pas une nouvelle intrigue principale qui remplace celle du billet.
- Tu peux inventer uniquement les détails nécessaires pour relier les éléments et rendre le scénario jouable : noms, circonstances, accès, réactions, conséquences immédiates et détails pratiques.
- N'invente pas de nouvel antagoniste principal, de nouvelle faction majeure, d'artefact majeur ou d'enjeu majeur sans que le billet le justifie.
- Si une formulation est maladroite ou issue d'une génération automatique, nettoie-la sans modifier son sens.
- Une erreur de formulation n'est jamais une nouvelle information.
- Si deux éléments semblent légèrement contradictoires, privilégie l'interprétation qui demande le moins de modifications.

NETTOYAGE DU BILLET BRUT
Le billet peut contenir répétitions, formulations mécaniques, accords incorrects ou assemblages provenant de champs générés séparément.
Reformule naturellement ces éléments avant de développer le scénario.
Conserve l'information sémantique, pas la formulation brute.

OBJECTIF
Le résultat est un véritable dossier de scénario A.E.G.I.S., pas un résumé romancé et pas une nouvelle.
Le MJ doit pouvoir comprendre rapidement ce qui se passe, ce que veulent les différents acteurs, ce que les agents savent ou peuvent découvrir, ce qu'ils peuvent faire, quelles sont les principales conséquences de leurs choix et comment la situation peut évoluer.

LONGUEUR ET DENSITÉ
- Produis un scénario compact, dense en informations et facilement consultable pendant une partie.
- Privilégie la densité d'information à la longueur.
- Évite toute répétition.
- Si une information peut être exprimée en une phrase, ne lui consacre pas un paragraphe.
- N'ajoute pas de développement atmosphérique qui ne crée ni information, ni choix, ni possibilité de jeu.
- Pour un scénario standard, vise environ 1 500 à 2 500 mots, en adaptant légèrement la longueur à la durée indiquée dans le billet.
- Les scénarios plus courts doivent rester réellement plus courts.

TITRE ET GENRE
Le titre doit refléter le genre sélectionné dans le billet et la promesse de l'aventure. Il ne doit pas simplement décrire le lieu ou l'objet principal.
Inspire-toi des conventions générales des titres célèbres du cinéma, des romans, des comics, des séries et des jeux du genre sélectionné, sans copier de titre existant ni citer une œuvre comme modèle.
Le titre doit être court, mémorable et évocateur.
Le genre influence légèrement le vocabulaire, le rythme de présentation et les images du synopsis, sans modifier les événements du billet.
Pour le Pulp, privilégie l'aventure spectaculaire, le mystère, le danger, l'exotisme, les lieux extraordinaires et les titres accrocheurs.

SYNOPSIS
Place le synopsis immédiatement après le titre.
Il doit faire 3 à 5 phrases maximum.
Il présente la situation, le problème central, l'élément singulier et l'enjeu.
Il doit donner envie de jouer mais ne doit pas résumer toutes les scènes ni révéler toute la résolution.

STRUCTURE
1. Titre
2. Synopsis
3. Situation initiale et mandat A.E.G.I.S.
4. Ce que les agents savent au début
5. Ce qui se passe réellement — MJ
6. Antagoniste principal et forces opposées
7. Artefact, phénomène ou objet
8. Lieux et éléments exploitables
9. Personnages et factions importants
10. Déroulement en scènes
11. Informations et découvertes
12. Confrontations et comportement tactique
13. Intervenants tiers et événements intermédiaires
14. Révélation éventuelle
15. Confrontation finale
16. Résolution, conditions de réussite et conséquences
17. Points à improviser

HIÉRARCHIE
- Les éléments centraux du billet reçoivent l'essentiel du développement.
- Les éléments secondaires restent secondaires.
- Les éléments OPTIONNELS restent périphériques et ne conditionnent jamais la réussite.

SCÈNES
Construis généralement 3 à 6 scènes majeures selon la durée du scénario.
Une scène représente une situation de jeu, pas simplement un lieu.
Pour chaque scène, utilise une structure courte :
- Situation
- Informations accessibles
- Actions ou approches possibles
- Sorties narratives

MICRO-DESCRIPTION DES LIEUX
Lorsqu'une scène introduit un nouveau lieu, place immédiatement sous son titre une micro-description narrative en italique.
- 2 ou 3 lignes maximum.
- Sensorielle et évocatrice.
- Directement lisible aux joueurs.
- Uniquement ce que les personnages peuvent percevoir immédiatement.
- Aucune information secrète.
- Pas d'explication technique.
Ne répète pas la description lorsqu'un lieu est déjà connu, sauf si son état a changé de manière significative.

MICRO-DESCRIPTION DES PERSONNAGES MAJEURS
Lorsqu'un antagoniste ou personnage majeur apparaît pour la première fois, une courte description narrative peut être placée sous son nom, en italique.
Elle doit être directement lisible aux joueurs et ne révéler aucune information secrète.
Garde cette description très courte afin de ne pas alourdir le dossier.

ANTICIPATION ET PORTES DE SORTIE NARRATIVES
Chaque scène doit présenter les principales portes narratives que les joueurs peuvent ouvrir.
Ne cherche pas à prédire toutes les actions possibles. Identifie uniquement les choix importants et les approches raisonnables.

Présente les sorties de manière extrêmement claire :
**Action des agents → conséquence immédiate → scène ou situation vers laquelle cela conduit.**

Une sortie peut :
- conduire à la scène suivante ;
- conduire à une autre scène déjà prévue ;
- créer une branche temporaire ;
- modifier les conditions d'une scène future ;
- permettre de contourner une scène.

Plusieurs choix différents peuvent converger vers la même scène.
Ne multiplie pas les branches indépendantes : une branche n'existe que si le choix modifie réellement la situation.
Les sorties narratives sont des possibilités, jamais des obligations.

LIBERTÉ DES JOUEURS
Ne présume jamais que les agents vont combattre, suivre les indices prévus ou accepter une solution proposée.
Les scènes sont des situations ouvertes.
Si les joueurs trouvent une autre solution cohérente, indique ou déduis une conséquence logique sans forcer le scénario à revenir artificiellement sur un chemin unique.

INDICES ET INFORMATIONS
Une information importante ne doit jamais dépendre d'un seul jet ou d'une seule action.
Lorsque c'est pertinent, donne plusieurs moyens raisonnables de l'obtenir : observation, discussion, exploration, confrontation, pouvoir surnaturel, connaissance, etc.

CONFRONTATIONS
Développe uniquement les capacités utiles.
Pour les adversaires importants, précise prioritairement :
- objectif immédiat ;
- comportement tactique ;
- capacités utiles ;
- limites ou faiblesses établies ;
- réaction en cas d'échec ;
- possibilité de négociation lorsqu'elle existe.
Ne crée pas de fiche complète inutile.

OPTIONNELS
Les éléments OPTIONNELS enrichissent le scénario mais ne constituent jamais une condition de victoire.
Le scénario principal doit fonctionner sans eux.

COHÉRENCE
Chaque élément important doit avoir une fonction dans le scénario.
Conserve les informations inhabituelles du billet, mais donne-leur une fonction cohérente.
Ne transforme pas une formulation mécanique en élément narratif supplémentaire.

TON
Dossier professionnel A.E.G.I.S., évocateur mais concis.
Le texte doit être immédiatement utilisable en partie.
Évite le style de nouvelle et les développements littéraires inutiles.

À la fin, ajoute une courte section « Points à improviser » avec uniquement les détails que le MJ peut librement adapter.

Voici le billet A.E.G.I.S. à développer :

--- DÉBUT DU BILLET ---
${billet}
--- FIN DU BILLET ---`}
async function copyText(text,button,label){try{await navigator.clipboard.writeText(text);button.textContent='Copié';setTimeout(function(){button.textContent=label},1400)}catch(e){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();button.textContent='Copié';setTimeout(function(){button.textContent=label},1400)}}
document.getElementById('copy').onclick=function(){copyText($('story').innerText,this,'Copier le billet')};
document.getElementById('copyPrompt').onclick=function(){var billet=$('story').innerText;copyText(developmentPrompt(billet),this,'Copier billet + prompt')};
</script></body></html>
