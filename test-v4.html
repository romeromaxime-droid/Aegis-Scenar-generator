event:["Un témoin inattendu donne une information utile puis disparaît.","Une porte ou un accès se referme momentanément.","Un petit groupe d’antagonistes mineurs surgit et fait perdre quelques minutes.","Un animal ou une créature locale réagit étrangement.","Un équipement cesse brièvement de fonctionner.","Un personnage secondaire reconnaît l’un des agents.","Un petit objet surnaturel est découvert au mauvais endroit.","Une erreur de l’antagoniste laisse momentanément une ouverture.","Un événement banal prend une tournure surnaturelle.","Les agents aperçoivent brièvement l’antagoniste sans pouvoir l’atteindre.","Un allié potentiel intervient puis repart.","Une manifestation étrange perturbe brièvement le lieu.","Un civil intervient au mauvais moment.","Un raccourci inattendu permet de gagner du temps.","Une petite créature jusque-là passive se réveille.","Un objet trouvé peut être utilisé plus tard sans être nécessaire à la résolution.","Une remarque anodine prend un autre sens à la fin de la mission."]
};

let S={};
function $(id){return document.getElementById(id)}
function pick(key){const a=D[key];if(!Array.isArray(a)||!a.length)throw new Error("Table introuvable : "+key);return a[Math.floor(Math.random()*a.length)]}
function other(key,current){const a=D[key];if(!Array.isArray(a)||!a.length)throw new Error("Table introuvable : "+key);if(a.length<2)return a[0];let v=current;let n=0;while(v===current&&n<20){v=pick(key);n++}return v}
function esc(v){return String(v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lc(v){return String(v).charAt(0).toLowerCase()+String(v).slice(1)}
function newBlocks(){S.ant={nature:pick('nature'),fonction:pick('fonction'),faction:pick('faction'),rapport:pick('rapport'),objectif:pick('objectif'),motivation:pick('motivation'),power:pick('power'),technique:pick('technique'),knowledge:pick('knowledge'),particularity:pick('particularity')};S.obj={nature:pick('objectNature'),origin:pick('objectOrigin'),fonction:pick('objectFunction'),link:pick('objectFunction'),manifestation:pick('manifestation')};S.char={nature:pick('charNature'),fonction:pick('charFunction'),position:pick('charPosition'),objectif:pick('charObjective'),motivation:pick('charMotivation'),info:pick('charInfo'),secret:pick('charSecret')};S.third={nature:pick('thirdNature'),role:pick('thirdRole'),objectif:pick('thirdObj'),motivation:pick('thirdMot')};}
function generateScenario(){S={mission:pick('mission'),situation:pick('situation'),friction:pick('friction'),reveal:pick('reveal'),res:{type:pick('resType'),objective:pick('resObj'),stakes:pick('stakes')},event:{type:pick('eventType'),text:pick('event')},loc:{nature:pick('location'),fonction:pick('locationFunction'),feature:pick('locationFeature')}};newBlocks();render();$('result').classList.remove('hidden')}
function opt(){let d=+$('duration').value;return{event:d>=3,reveal:d>=4,third:d>=4}}
function makeTitle(){let g=$('genre').value;if(g==='Horreur')return'La présence';if(g==='Enquête')return'Les traces du dossier';if(g==='Exploration / Découverte / Lore')return'Les traces de l’ancien monde';if(g==='Social / Éthique / Dilemme')return'Le prix du choix';if(g==='Poétique / Étrange')return'Ce qui demeure de l’autre côté';if(g==='Thriller / Course contre la montre')return'Avant que tout bascule';return'Dossier A.E.G.I.S.'}
function row(label,val,fn,opt=false){let d=document.createElement('div');d.className='row'+(opt?' optional':'');let n=document.createElement('div');n.className='name';n.innerHTML=esc(label)+(opt?' <span class="tag">OPTIONNEL</span>':'');let v=document.createElement('div');v.className='value';v.textContent=val;let b=document.createElement('button');b.className='reroll';b.textContent='↻';b.onclick=fn;d.append(n,v,b);return d}
function section(title,id,rows,opt=false){let s=document.createElement('div');s.className='section'+(opt?' optional':'');let hd=document.createElement('div');hd.className='sectionHead';let h=document.createElement('h3');h.innerHTML=esc(title)+(opt?' <span class="tag">OPTIONNEL</span>':'');let b=document.createElement('button');b.className='block';b.textContent='↻ Reroll du bloc';b.onclick=()=>rerollBlock(id);hd.append(h,b);s.append(hd);rows.forEach(r=>s.append(r));return s}
function rf(block,field){if(block==='ant')S.ant[field]=other(field,S.ant[field]);else if(block==='obj'){let m={nature:'objectNature',origin:'objectOrigin',fonction:'objectFunction',link:'objectFunction',manifestation:'manifestation'};S.obj[field]=other(m[field],S.obj[field])}else if(block==='char'){let m={nature:'charNature',fonction:'charFunction',position:'charPosition',objectif:'charObjective',motivation:'charMotivation',info:'charInfo',secret:'charSecret'};S.char[field]=other(m[field],S.char[field])}else if(block==='third'){let m={nature:'thirdNature',role:'thirdRole',objectif:'thirdObj',motivation:'thirdMot'};S.third[field]=other(m[field],S.third[field])}else if(block==='loc'){let m={nature:'location',fonction:'locationFunction',feature:'locationFeature'};S.loc[field]=other(m[field],S.loc[field])}else if(block==='res'){let m={type:'resType',objective:'resObj',stakes:'stakes'};S.res[field]=other(m[field],S.res[field])}else if(block==='event'){let m={type:'eventType',text:'event'};S.event[field]=other(m[field],S.event[field])}else{S[block]=other(block,S[block])}render()}
function rerollBlock(id){if(id==='ant'){S.ant={nature:pick('nature'),fonction:pick('fonction'),faction:pick('faction'),rapport:pick('rapport'),objectif:pick('objectif'),motivation:pick('motivation'),power:pick('power'),technique:pick('technique'),knowledge:pick('knowledge'),particularity:pick('particularity')}}if(id==='obj'){S.obj={nature:pick('objectNature'),origin:pick('objectOrigin'),fonction:pick('objectFunction'),link:pick('objectFunction'),manifestation:pick('manifestation')}}if(id==='char'){S.char={nature:pick('charNature'),fonction:pick('charFunction'),position:pick('charPosition'),objectif:pick('charObjective'),motivation:pick('charMotivation'),info:pick('charInfo'),secret:pick('charSecret')}}if(id==='third'){S.third={nature:pick('thirdNature'),role:pick('thirdRole'),objectif:pick('thirdObj'),motivation:pick('thirdMot')}}render()}
function render(){
  const o=opt(), r=$('rows');
  r.innerHTML='';
  $('title').textContent=makeTitle();
  $('meta').textContent=`${$('agents').value} agents · ${$('duration').value} h · ${$('genre').value}`;
  const mapRows=(obj,block,defs)=>defs.map(x=>row(x[1],obj[x[0]],()=>rf(block,x[0])));
  r.append(section('Cadre de mission',null,[row('Nature de la mission',S.mission,()=>rf('mission')),row('Situation de départ',S.situation,()=>rf('situation')),row('Lieu — nature',S.loc.nature,()=>rf('loc','nature')),row('Lieu — fonction',S.loc.fonction,()=>rf('loc','fonction')),row('Lieu — caractéristique',S.loc.feature,()=>rf('loc','feature'))]));
  r.append(section('Antagoniste principal','ant',mapRows(S.ant,'ant',[['nature','Nature'],['fonction','Fonction'],['faction','Faction'],['rapport','Rapport à la faction'],['objectif','Objectif'],['motivation','Motivation'],['power','Pouvoir / capacité'],['technique','Technique utile'],['knowledge','Connaissance utile'],['particularity','Particularité']])));
  r.append(section('Artefact / phénomène / objet','obj',mapRows(S.obj,'obj',[['nature','Nature'],['origin','Origine'],['fonction','Fonction'],['link','Lien avec l’affaire'],['manifestation','Manifestation']])));
  r.append(section('Personnage clé','char',mapRows(S.char,'char',[['nature','Nature'],['fonction','Fonction'],['position','Position dans le conflit'],['objectif','Objectif'],['motivation','Motivation'],['info','Information détenue'],['secret','Secret éventuel']])));
  r.append(section('Friction / contrainte opérationnelle',null,[row('Contrainte',S.friction,()=>rf('friction'))]));
  r.append(section('Révélation',null,[row('Révélation',S.reveal,()=>rf('reveal'))],!o.reveal));
  r.append(section('Résolution / enjeu final',null,[row('Type',S.res.type,()=>rf('res','type')),row('Objectif final',S.res.objective,()=>rf('res','objective')),row('Enjeu',S.res.stakes,()=>rf('res','stakes'))]));
  r.append(section('Intervenant tiers','third',mapRows(S.third,'third',[['nature','Nature'],['role','Rôle dans le conflit'],['objectif','Objectif'],['motivation','Motivation']]),!o.third));
  r.append(section('Événement intermédiaire','event',[row('Type',S.event.type,()=>rf('event','type')),row('Événement',S.event.text,()=>rf('event','text'))],!o.event));
  $('story').innerHTML=story();
}
function tone(){let g=$('genre').value;return g==='Horreur'?"La situation donne rapidement l’impression que le phénomène observe les agents.":g==='Enquête'?"Les premiers faits paraissent contradictoires, mais leur répétition dessine une logique.":g==='Exploration / Découverte / Lore'?"Chaque découverte ajoute une pièce à une histoire plus ancienne que l’intervention.":g==='Social / Éthique / Dilemme'?"Le danger ne suffit pas à désigner un camp : plusieurs intérêts peuvent être légitimes et incompatibles.":g==='Poétique / Étrange'?"L’affaire conserve une part d’étrangeté que les agents ne peuvent pas entièrement réduire à une explication rationnelle.":g==='Survie'?"Le terrain impose de rester opérationnel avant toute autre considération.":g==='Thriller / Course contre la montre'?"Le temps réduit progressivement la marge de manœuvre des agents.":"La situation privilégie l’action, les déplacements et les confrontations directes."}
function story(){let a=S.ant,o=S.obj,c=S.char,l=S.loc,x=S.res,t=S.third,e=S.event,p=`<h3>Situation et mandat</h3><p>A.E.G.I.S. déploie ${$('agents').value} agents pour ${lc(S.mission)} ${S.situation} ${tone()}</p>`;p+=`<h3>Ce qui se joue réellement</h3><p>La force opposée est ${lc(a.nature)}, qui agit comme ${lc(a.fonction)}. ${a.faction} : ${lc(a.rapport)} Son objectif est de ${lc(a.objectif)}, motivé par ${lc(a.motivation)}. L’affaire tourne autour de ${lc(o.nature)}, d’origine ${lc(o.origin)}, dont la fonction est de ${lc(o.fonction)}.</p>`;p+=`<h3>Terrain et acteurs</h3><p>Le dossier conduit les agents vers ${lc(l.nature)}. Le lieu sert de ${lc(l.fonction)} et ${lc(l.feature)} ${lc(c.nature)} intervient comme ${lc(c.fonction)} ; sa position est ${lc(c.position)}. Son objectif est de ${lc(c.objectif)}, motivé par ${lc(c.motivation)}.</p>`;p+=`<h3>Confrontation</h3><p>La progression est compliquée par ${lc(S.friction)}. L’antagoniste dispose de ${lc(a.power)} et privilégie ${lc(a.technique)}. Il connaît ${lc(a.knowledge)}. Sa particularité est la suivante : ${lc(a.particularity)}.</p>`;let oo=opt();p+=`<h3>Résolution</h3><p>La situation doit finalement prendre la forme d’une ${x.type.toLowerCase()} : les agents doivent ${lc(x.objective)}. L’enjeu porte sur ${lc(x.stakes)}.</p>`;p+=`<h3${oo.reveal?'':' class="optional"'}>Révélation${oo.reveal?'':' — OPTIONNEL'}</h3><p${oo.reveal?'':' class="optional"'}>${S.reveal}</p>`;p+=`<h3${oo.third?'':' class="optional"'}>Intervenant tiers${oo.third?'':' — OPTIONNEL'}</h3><p${oo.third?'':' class="optional"'}>${c?`${t.nature} : ${t.role} Son objectif est de ${lc(t.objectif)}, pour ${lc(t.motivation)}.`:''}</p>`;p+=`<h3${oo.event?'':' class="optional"'}>Événement intermédiaire${oo.event?'':' — OPTIONNEL'}</h3><p${oo.event?'':' class="optional"'}>${e.type} : ${e.text} Cet événement ne doit pas être nécessaire à la résolution, mais peut laisser un petit effet, un objet ou un écho jusqu’à la fin.</p>`;return p}
window.generateScenario=generateScenario; window.runGenerator=function(){var result=document.getElementById('result');var storyBox=document.getElementById('story');try{generateScenario();result.classList.remove('hidden');}catch(err){result.classList.remove('hidden');storyBox.innerHTML='<h3>Erreur de génération</h3><p>'+esc(err && err.message ? err.message : String(err))+'</p>';}}; document.getElementById('copy').onclick=async function(){let t=$('story').innerText;try{await navigator.clipboard.writeText(t);$('copy').textContent='Copié';setTimeout(function(){$('copy').textContent='Copier'},1200)}catch(e){$('copy').textContent='Copie impossible'}};
</script></body></html>
