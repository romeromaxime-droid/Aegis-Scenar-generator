<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.E.G.I.S. — Générateur de micro-scénarios v2</title>
<style>
:root{--bg:#111315;--panel:#1a1d20;--line:#343a40;--text:#eee9df;--muted:#aaa79f;--accent:#c6a46b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#292d30,#111315 60%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{padding:26px 20px;border-bottom:1px solid var(--line);background:#0b0d0e}header strong{font:700 38px Georgia,serif;letter-spacing:.12em}header small{display:block;color:var(--accent);letter-spacing:.16em;margin-top:3px}
main{max-width:1000px;margin:25px auto;padding:0 16px}.panel{background:#1a1d20;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 15px 40px #0005}
h1,h2{font-family:Georgia,serif;font-weight:500}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{color:var(--muted);font-size:13px}select{display:block;width:100%;margin-top:6px;padding:11px;background:#101214;color:var(--text);border:1px solid var(--line);border-radius:7px;font:inherit}
button{border-radius:7px;padding:10px 14px;font:inherit;cursor:pointer}.primary{margin-top:18px;background:var(--accent);border:1px solid var(--accent);font-weight:700}.secondary,.reroll{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent)}
.row{display:grid;grid-template-columns:220px 1fr auto;gap:15px;padding:14px 0;border-bottom:1px solid #2b2f32}.name{font-weight:650}.value{color:#ddd8cf}.reroll{padding:4px 9px;font-size:18px}.pitch{margin-top:20px;padding:18px;border-left:3px solid var(--accent);background:#111416}.meta{color:var(--muted);font-size:13px;margin-top:4px}.hidden{display:none}
@media(max-width:700px){header strong{font-size:30px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.value{grid-column:1/-1}.head{align-items:flex-start}}
</style>
</head>

<main>
<section class="panel">
<h1>Paramètres de mission</h1>
<div class="grid">
<label>Nombre d'agents<select id="agents"><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
<label>Durée<select id="duration"><option value="2">2 h</option><option value="3">3 h</option><option value="4">4 h</option><option value="5">5 h</option></select></label>
<label>Genre / tonalité
<select id="genre">
<option value="Pulp / Action">Pulp / Action</option>
<option value="Horreur">Horreur</option>
<option value="Enquête">Enquête</option>
<option value="Exploration / Découverte / Lore">Exploration / Découverte / Lore</option>
<option value="Social / Éthique / Dilemme">Social / Éthique / Dilemme</option>

</select>
</label>
</div>
<button class="primary" id="generate">Générer le scénario</button>
</section>
<section class="panel hidden" id="result">
<div class="head"><div><span class="eyebrow">BILLET DE SCÉNARIO</span><h2 id="title">Mission A.E.G.I.S.</h2><div class="meta" id="meta"></div></div><button class="secondary" id="copy">Copier</button></div>
<div id="rows"></div><div class="pitch" id="pitch"></div>
</section>
</main>

const fields=[
["mission","Nature de la mission","mission"],["situation","Situation de départ","situation"],["antagonist","Antagoniste / force opposée","antagonist"],["objective","Objectif de l’antagoniste","objective"],["object","Artefact / phénomène / objet","object"],["location","Lieu","location"],["character","Personnage clé","character"],["power","Pouvoir / particularité surnaturelle","power"],["friction","Friction / contrainte opérationnelle","friction"],["reveal","Révélation","reveal"],["resolution","Résolution / enjeu final","resolution"],["third","Intervenant tiers","third"],["event","Événement intermédiaire","event"],["jurisdiction","Juridiction","jurisdiction"]];

const labels={
mission:"Nature de la mission",situation:"Situation de départ",antagonist:"Antagoniste / force opposée",
objective:"Objectif de l’antagoniste",object:"Artefact / phénomène / objet",location:"Lieu",character:"Personnage clé",
power:"Pouvoir / particularité surnaturelle",friction:"Friction / contrainte opérationnelle",reveal:"Révélation",
resolution:"Résolution / enjeu final",third:"Intervenant tiers",event:"Événement intermédiaire",jurisdiction:"Juridiction"
};

const $=id=>document.getElementById(id);
if(!$("genre").options.length){
  D.genres.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;$("genre").appendChild(o)});
}
let state={};

function pick(k){const a=D[k];return a[Math.floor(Math.random()*a.length)]}

function has(s, terms){s=(s||"").toLowerCase();return terms.some(t=>s.includes(t))}
function clean(s){return (s||"").replace(/[.…]+$/,"").trim()}
function lower(s){s=clean(s);return s?s.charAt(0).toLowerCase()+s.slice(1):s}
function article(s){
 const x=lower(s);
 if(/^(un|une|des|l’|l'|la |le |les |du |de la |de l’|de l')/.test(x)) return x;
 return x;
}

/* La couche de cohérence. Elle ne remplace aucun résultat tiré :
   elle choisit seulement comment les résultats s'articulent. */
function coherence(){
 const c={};
 const all=Object.values(state).join(" ").toLowerCase();
 c.fae=has(all,["peuple féerique","communauté fae","territoire féerique"]);
 c.memory=has(state.power,["mémoire","identité"]);
 c.dimension=has(state.location,["poche extradimensionnelle","dimension","réalité"]);
 c.secret=has(state.resolution,["secret d’a.e.g.i.s."]);
 c.victim=has(state.character,["victime"]);
 c.realMission=has(state.reveal,["véritable mission"]);
 c.cut=has(state.event,["communications","sortie"]);
 c.horror=$("genre").value==="Horreur";
 c.ethics=$("genre").value==="Social / Éthique / Dilemme";
 return c;
}

function makeTitle(){
 const c=coherence();
 if(c.fae&&c.memory) return "Les souvenirs du royaume absent";
 if(c.dimension&&c.realMission) return "Derrière la porte";
 if(c.horror&&c.memory) return "Ceux qui se souviennent";
 if(c.ethics&&c.secret) return "Le prix du secret";
 if(c.fae) return "Le royaume derrière le monde";
 if(c.memory) return "Les vies oubliées";
 if(c.dimension) return "Au-delà du seuil";
 if(c.horror) return "La présence";
 return "Dossier A.E.G.I.S.";
}

function opening(){
 const c=coherence(), n=+$("agents").value, d=+$("duration").value, g=$("genre").value;
 let s=`A.E.G.I.S. déploie ${n} agents pour une opération de ${d} heures, dans un registre ${g}. ${clean(state.situation)}`;
 if(state.mission) s+=` La mission consiste à ${lower(state.mission).replace(/^à /,"")}.`;
 return s;
}

function connective(){
 const c=coherence();
 let s="";
 if(c.fae&&c.dimension) s+=" Le lieu n'est pas un simple refuge : il constitue un territoire de la communauté fae, séparé du monde humain par une frontière extradimensionnelle.";
 else if(c.dimension) s+=" Le lieu constitue un espace séparé du monde humain, dont l'accès et les conditions de sortie ne sont pas garantis.";
 if(c.memory&&c.victim) s+=" La victime apparente devient rapidement centrale : ses souvenirs ne correspondent pas entièrement à ce qu'elle raconte, et son implication semble liée à la manipulation de la mémoire ou de l'identité.";
 else if(c.memory) s+=" Les agents comprennent rapidement que les souvenirs et l'identité des personnes impliquées ne peuvent pas être considérés comme fiables.";
 if(c.fae&&state.objective&&has(state.objective,["sauver","libérer"])) s+=" La communauté fae affirme agir pour sauver ou libérer quelqu'un, ce qui place l'intervention d'A.E.G.I.S. dans une situation moins simple qu'il n'y paraît.";
 if(state.character) s+=` ${clean(state.character)} détient ou connaît une partie des éléments utiles.`;
 if(state.power) s+=` ${clean(state.power)} constitue la particularité surnaturelle centrale.`;
 return s;
}

function complications(){
 let s="";
 if(state.friction) s+=` La mission est compliquée par ${lower(state.friction)}.`;
 if(state.event) s+=` En cours d'opération, ${lower(state.event)}.`;
 if(state.third) s+=` Un troisième intervenant entre également dans la situation : ${lower(state.third)}.`;
 return s;
}

function climax(){
 const c=coherence();
 let s="";
 if(state.reveal) s+=` La révélation finale est la suivante : ${lower(state.reveal)}.`;
 if(c.realMission&&c.secret) s+=" Les agents découvrent alors que le secret qu'ils sont censés préserver n'est pas sans conséquence pour les personnes présentes sur place.";
 if(state.resolution) s+=` La résolution attendue est : ${lower(state.resolution)}.`;
 return s;
}

function density(){
 const n=+$("agents").value;
 if(n<=3)return "une opposition principale et éventuellement un élément secondaire";
 if(n===4)return "une opposition principale et un élément secondaire";
 if(n===5)return "une opposition principale et un à deux éléments secondaires";
 return "une opposition principale, deux éléments secondaires et éventuellement un mini-boss";
}

function buildPitch(){
 const parts=[opening(),connective(),complications(),climax()];
 let p=parts.filter(Boolean).join(" ");
 p+=` La densité prévue pour cette équipe est ${density()}.`;
 return p.replace(/\s+/g," ").trim();
}

function generate(){
 if(!$("genre").value) $("genre").value=D.genres[0];
 state={};
 const d=+$("duration").value;
 fields.forEach(([id,,k])=>{
   if(id==="third"&&d<4)return;
   if(id==="event"&&d<3)return;
   state[id]=pick(k);
 });
 render();
 $("result").classList.remove("hidden");
}

function reroll(id){
 const f=fields.find(x=>x[0]===id);
 if(!f)return;
 state[id]=pick(f[2]);
 render();
}

function render(){
 $("title").textContent=makeTitle();
 $("meta").textContent=`${$("agents").value} agents · ${$("duration").value} h · ${$("genre").value}`;
 const rows=$("rows");rows.innerHTML="";
 fields.forEach(([id,label])=>{
   if(!state[id])return;
   const d=document.createElement("div");d.className="row";
   const name=document.createElement("div");name.className="name";name.textContent=label;
   const value=document.createElement("div");value.className="value";value.textContent=state[id];
   const b=document.createElement("button");b.className="reroll";b.textContent="↻";b.onclick=()=>reroll(id);
   d.append(name,value,b);rows.appendChild(d);
 });
 $("pitch").textContent=buildPitch();
}

$("generate").onclick=generate;
$("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText($("pitch").textContent);$("copy").textContent="Copié";setTimeout(()=>$("copy").textContent="Copier",1200)}
 catch(e){$("copy").textContent="Sélectionnez le texte pour le copier"}
};
</script>
