function pick(k){let a=D[k];return a[Math.floor(Math.random()*a.length)]}
function other(k,c){let a=D[k],v=c,n=0;while(v===c&&n++<20)v=pick(k);return v}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c))}
function lc(v){return String(v).charAt(0).toLowerCase()+String(v).slice(1)}

function updatePlayerSelectors(){
 const n=+$('agents').value,box=$('playerSelectors'),old=[...box.querySelectorAll('select')].map(s=>s.value);
 box.innerHTML='';
 for(let i=0;i<n;i++){
  const l=document.createElement('label');l.textContent='Joueur '+(i+1);
  const s=document.createElement('select');
  s.innerHTML='<option value="">— Choisir un personnage —</option>'+Object.keys(CHARACTERS).map(k=>'<option value="'+k+'">'+k+'</option>').join('');
  if(old[i]&&CHARACTERS[old[i]])s.value=old[i];
  s.onchange=refreshPlayerOptions;l.appendChild(s);box.appendChild(l);
 }
 refreshPlayerOptions()
}
function refreshPlayerOptions(){
 const ss=[...document.querySelectorAll('#playerSelectors select')],used=ss.map(s=>s.value).filter(Boolean);
 ss.forEach(s=>[...s.options].forEach(o=>{if(o.value)o.disabled=used.includes(o.value)&&o.value!==s.value}))
}
function getSelectedPlayers(){
 const v=[...document.querySelectorAll('#playerSelectors select')].map(s=>s.value);
 if(v.length!==+$('agents').value||v.some(x=>!x))throw new Error('Sélectionne un personnage différent pour chaque joueur.');
 if(new Set(v).size!==v.length)throw new Error('Un personnage ne peut pas être sélectionné deux fois.');
 return v
}
function characterPrompt(){
 return getSelectedPlayers().map((k,i)=>'JOUEUR '+(i+1)+' — '+CHARACTERS[k].fullName+'\nDescription visuelle fixe : '+CHARACTERS[k].visual).join('\n\n')
}
function characterSummary(){return getSelectedPlayers().map((k,i)=>'Joueur '+(i+1)+' : '+CHARACTERS[k].fullName).join(' · ')}

function buildBlocks(){
 S.ant={nature:pick('nature'),fonction:pick('fonction'),faction:pick('faction'),rapport:pick('rapport'),objectif:pick('objectif'),motivation:pick('motivation'),power:pick('power'),technique:pick('technique'),knowledge:pick('knowledge'),particularity:pick('particularity')};
 S.obj={nature:pick('objectNature'),origin:pick('objectOrigin'),fonction:pick('objectFunction'),link:pick('objectFunction'),manifestation:pick('manifestation')};
 S.char={nature:pick('nature'),fonction:pick('fonction'),position:pick('thirdRole'),objectif:pick('objectif'),motivation:pick('motivation'),info:pick('knowledge'),secret:pick('reveal')};
 S.third={nature:pick('thirdNature'),role:pick('thirdRole'),objectif:pick('thirdObj'),motivation:pick('thirdMot')}
}
function generateScenario(){
 S={selectedPlayers:getSelectedPlayers(),mission:pick('mission'),situation:pick('situation'),friction:pick('friction'),reveal:pick('reveal'),res:{type:pick('resType'),objective:pick('resObj'),stakes:pick('stakes')},event:{type:pick('eventType'),text:pick('event')},loc:{nature:pick('location'),fonction:pick('locationFunction'),feature:pick('locationFeature')}};
 buildBlocks();render();$('result').classList.remove('hidden')
}
function opt(){let d=+$('duration').value;return{event:d>=3,reveal:d>=4,third:d>=4}}
function makeTitle(){
 let g=$('genre').value;
 if(g==='Horreur')return'La présence';if(g==='Enquête')return'Les traces du dossier';
 if(g==='Exploration / Découverte / Lore')return'Les traces de l’ancien monde';
 if(g==='Social / Éthique / Dilemme')return'Le prix du choix';
 if(g==='Poétique / Étrange')return'Ce qui demeure de l’autre côté';
 if(g==='Thriller / Course contre la montre')return'Avant que tout bascule';
 return'Dossier A.E.G.I.S.'
}
function row(label,val,fn,opt=false){
 let d=document.createElement('div');d.className='row'+(opt?' optional':'');
 let n=document.createElement('div');n.className='name';n.innerHTML=esc(label)+(opt?' <span class="tag">OPTIONNEL</span>':'');
 let v=document.createElement('div');v.className='value';v.textContent=val;
 let b=document.createElement('button');b.className='reroll';b.textContent='↻';b.onclick=fn;d.append(n,v,b);return d
}
function section(title,id,rows,opt=false){
 let s=document.createElement('div');s.className='section'+(opt?' optional':'');
 let h=document.createElement('div');h.className='sectionHead';
 let t=document.createElement('h3');t.innerHTML=esc(title)+(opt?' <span class="tag">OPTIONNEL</span>':'');
 let b=document.createElement('button');b.className='block';b.textContent='↻ Reroll du bloc';b.onclick=()=>rerollBlock(id);
 h.append(t,b);s.append(h);rows.forEach(r=>s.append(r));return s
}
function rf(block,field){
 const maps={ant:{nature:'nature',fonction:'fonction',faction:'faction',rapport:'rapport',objectif:'objectif',motivation:'motivation',power:'power',technique:'technique',knowledge:'knowledge',particularity:'particularity'},
 obj:{nature:'objectNature',origin:'objectOrigin',fonction:'objectFunction',link:'objectFunction',manifestation:'manifestation'},
 char:{nature:'nature',fonction:'fonction',position:'thirdRole',objectif:'objectif',motivation:'motivation',info:'knowledge',secret:'reveal'},
 third:{nature:'thirdNature',role:'thirdRole',objectif:'thirdObj',motivation:'thirdMot'}};
 if(maps[block])S[block][field]=other(maps[block][field],S[block][field]);else S[block]=other(block,S[block]);
 render()
}
function rerollBlock(id){
 if(id==='ant')S.ant={nature:pick('nature'),fonction:pick('fonction'),faction:pick('faction'),rapport:pick('rapport'),objectif:pick('objectif'),motivation:pick('motivation'),power:pick('power'),technique:pick('technique'),knowledge:pick('knowledge'),particularity:pick('particularity')};
 if(id==='obj')S.obj={nature:pick('objectNature'),origin:pick('objectOrigin'),fonction:pick('objectFunction'),link:pick('objectFunction'),manifestation:pick('manifestation')};
 if(id==='char')S.char={nature:pick('nature'),fonction:pick('fonction'),position:pick('thirdRole'),objectif:pick('objectif'),motivation:pick('motivation'),info:pick('knowledge'),secret:pick('reveal')};
 if(id==='third')S.third={nature:pick('thirdNature'),role:pick('thirdRole'),objectif:pick('thirdObj'),motivation:pick('thirdMot')};
 render()
}
function render(){
 const o=opt(),r=$('rows');r.innerHTML='';
 $('title').textContent=makeTitle();
 $('meta').textContent=`${$('agents').value} joueurs · ${$('duration').value} h · ${$('genre').value}`;
 $('playerMeta').textContent='Joueurs : '+characterSummary();
 const mr=(ob,b,defs)=>defs.map(x=>row(x[1],ob[x[0]],()=>rf(b,x[0])));
 r.append(section('Cadre de mission',null,[row('Nature de la mission',S.mission,()=>rf('mission')),row('Situation de départ',S.situation,()=>rf('situation')),row('Lieu — nature',S.loc.nature,()=>rf('loc','nature')),row('Lieu — fonction',S.loc.fonction,()=>rf('loc','fonction')),row('Lieu — caractéristique',S.loc.feature,()=>rf('loc','feature'))]));
 r.append(section('Antagoniste principal','ant',mr(S.ant,'ant',[['nature','Nature'],['fonction','Fonction'],['faction','Faction'],['rapport','Rapport à la faction'],['objectif','Objectif'],['motivation','Motivation'],['power','Pouvoir / capacité'],['technique','Technique utile'],['knowledge','Connaissance utile'],['particularity','Particularité']])));
 r.append(section('Artefact / phénomène / objet','obj',mr(S.obj,'obj',[['nature','Nature'],['origin','Origine'],['fonction','Fonction'],['link','Lien avec l’affaire'],['manifestation','Manifestation']])));
 r.append(section('Personnage clé','char',mr(S.char,'char',[['nature','Nature'],['fonction','Fonction'],['position','Position dans le conflit'],['objectif','Objectif'],['motivation','Motivation'],['info','Information détenue'],['secret','Secret éventuel']])));
 r.append(section('Friction / contrainte opérationnelle',null,[row('Contrainte',S.friction,()=>rf('friction'))]));
 r.append(section('Révélation',null,[row('Révélation',S.reveal,()=>rf('reveal'))],!o.reveal));
 r.append(section('Résolution / enjeu final',null,[row('Type',S.res.type,()=>rf('res','type')),row('Objectif final',S.res.objective,()=>rf('res','objective')),row('Enjeu',S.res.stakes,()=>rf('res','stakes'))]));
 r.append(section('Intervenant tiers','third',mr(S.third,'third',[['nature','Nature'],['role','Rôle dans le conflit'],['objectif','Objectif'],['motivation','Motivation']]),!o.third));
 r.append(section('Événement intermédiaire','event',[row('Type',S.event.type,()=>rf('event','type')),row('Événement',S.event.text,()=>rf('event','text'))],!o.event));
 $('story').innerHTML=story()
}
function tone(){
 let g=$('genre').value;
 return g==='Horreur'?"La situation donne rapidement l’impression que le phénomène observe les agents.":g==='Enquête'?"Les premiers faits paraissent contradictoires, mais leur répétition dessine une logique.":g==='Exploration / Découverte / Lore'?"Chaque découverte ajoute une pièce à une histoire plus ancienne que l’intervention.":g==='Social / Éthique / Dilemme'?"Le danger ne suffit pas à désigner un camp : plusieurs intérêts peuvent être légitimes et incompatibles.":g==='Poétique / Étrange'?"L’affaire conserve une part d’étrangeté que les agents ne peuvent pas entièrement réduire à une explication rationnelle.":g==='Survie'?"Le terrain impose de rester opérationnel avant toute autre considération.":g==='Thriller / Course contre la montre'?"Le temps réduit progressivement la marge de manœuvre des agents.":"La situation privilégie l’action, les déplacements et les confrontations directes."
}
function story(){
 let a=S.ant,o=S.obj,c=S.char,l=S.loc,x=S.res,t=S.third,e=S.event,p=`<h3>Situation et mandat</h3><p>A.E.G.I.S. déploie ${$('agents').value} agents pour ${lc(S.mission)} ${S.situation} ${tone()}</p>`;
 p+=`<h3>Ce qui se joue réellement</h3><p>La force opposée est ${lc(a.nature)}, qui agit comme ${lc(a.fonction)}. ${a.faction} : ${lc(a.rapport)} Son objectif est de ${lc(a.objectif)}, motivé par ${lc(a.motivation)}. L’affaire tourne autour de ${lc(o.nature)}, d’origine ${lc(o.origin)}, dont la fonction est de ${lc(o.fonction)}.</p>`;
 p+=`<h3>Terrain et acteurs</h3><p>Le dossier conduit les agents vers ${lc(l.nature)}. Le lieu sert de ${lc(l.fonction)} et ${lc(l.feature)} ${lc(c.nature)} intervient comme ${lc(c.fonction)} ; sa position est ${lc(c.position)}. Son objectif est de ${lc(c.objectif)}, motivé par ${lc(c.motivation)}.</p>`;
 p+=`<h3>Confrontation</h3><p>La progression est compliquée par ${lc(S.friction)}. L’antagoniste dispose de ${lc(a.power)} et privilégie ${lc(a.technique)}. Il connaît ${lc(a.knowledge)}. Sa particularité est la suivante : ${lc(a.particularity)}.</p>`;
 let oo=opt();
 p+=`<h3>Résolution</h3><p>La situation doit finalement prendre la forme d’une ${x.type.toLowerCase()} : les agents doivent ${lc(x.objective)}. L’enjeu porte sur ${lc(x.stakes)}.</p>`;
 p+=`<h3${oo.reveal?'':' class="optional"'}>Révélation${oo.reveal?'':' — OPTIONNEL'}</h3><p${oo.reveal?'':' class="optional"'}>${S.reveal}</p>`;
 p+=`<h3${oo.third?'':' class="optional"'}>Intervenant tiers${oo.third?'':' — OPTIONNEL'}</h3><p${oo.third?'':' class="optional"'}>${t.nature} : ${t.role} Son objectif est de ${lc(t.objectif)}, pour ${lc(t.motivation)}.</p>`;
 p+=`<h3${oo.event?'':' class="optional"'}>Événement intermédiaire${oo.event?'':' — OPTIONNEL'}</h3><p${oo.event?'':' class="optional"'}>${e.type} : ${e.text} Cet événement ne doit pas être nécessaire à la résolution, mais peut laisser un petit effet, un objet ou un écho jusqu’à la fin.</p>`;
 return p
}

function developmentPrompt(billet){
 const selectedCharacters=characterPrompt();
 return `Tu es auteur et concepteur de scénarios pour A.E.G.I.S., un jeu de rôle d’action surnaturelle.

À partir du billet opérationnel fourni à la fin de ce message, transforme ce matériau en un scénario complet, cohérent et directement exploitable par un meneur de jeu.

Le billet est le socle du scénario : développe ce qui existe, ne repars pas de zéro.

PERSONNAGES JOUEURS SÉLECTIONNÉS
Les personnages ci-dessous sont les agents joueurs de cette mission. Ils sont tous différents. Respecte leur identité, leur âge apparent, leur morphologie, leur tenue, leurs accessoires et leurs particularités visuelles.

${selectedCharacters}

RÈGLES DE CONSERVATION
- Conserve mission, nombre de joueurs, durée et tonalité.
- Conserve les éléments établis concernant antagonistes, objectifs, motivations, pouvoirs, limites et particularités.
- Conserve artefact/phénomène/objet, origine, fonction et rôle.
- Conserve lieux, personnages, factions, intervenants et enjeux.
- Ne supprime pas un élément inhabituel.
- Les éléments OPTIONNELS ne deviennent jamais des conditions de victoire.
- Ne crée pas une nouvelle intrigue principale remplaçant celle du billet.
- Tu peux préciser et relier les éléments pour les rendre jouables.
- Nettoie naturellement les formulations mécaniques, répétitions et maladresses sans modifier leur sens.
- Si deux éléments semblent légèrement contradictoires, choisis l’interprétation demandant le moins de modifications.

OBJECTIF
Produis un véritable billet de scénario A.E.G.I.S., pas un résumé romancé.
Le MJ doit comprendre rapidement ce qui se passe, ce que veulent les acteurs, ce que les agents peuvent découvrir et comment la situation évolue.

COMPACTNESS
Scénario dense et facilement consultable. Pas de remplissage atmosphérique. Environ 1500–2500 mots selon la durée.

TITRE ET GENRE
Le titre doit refléter le genre choisi et la promesse du scénario, pas seulement un lieu ou un objet. Le genre influence vocabulaire, rythme, tension et présentation sans modifier les faits établis.

SYNOPSIS
3 à 5 phrases maximum : situation, problème central, élément singulier et enjeux. Évocateur sans révéler la fin.

STRUCTURE
1. Titre
2. Synopsis
3. Situation initiale et mandat
4. Ce que les agents savent
5. Ce qui se passe réellement — MJ
6. Antagoniste et forces opposées
7. Artefact/phénomène/objet
8. Lieu et terrain
9. Personnages et factions
10. Déroulement en scènes
11. Informations et découvertes
12. Confrontations et comportement tactique
13. Intervenants tiers
14. Événement intermédiaire
15. Révélation éventuelle
16. Confrontation finale
17. Résolution, conditions de réussite et conséquences

SCÈNES
Prévois environ 3 à 6 scènes selon la durée.
Chaque scène doit être une situation de jeu, pas simplement un lieu.

Format :
SCÈNE X — TITRE
*Micro-description prête à lire aux joueurs, 2–3 lignes maximum, environ 40–50 mots, uniquement ce qui est immédiatement perceptible.*
Situation
Informations
Actions possibles
SORTIES NARRATIVES
→ ACTION → conséquence immédiate → destination
État de la situation : une phrase maximum.

Les sorties peuvent être PROGRESSION, AVANTAGE, DÉSAVANTAGE ou BRANCHE.
Plusieurs branches peuvent converger vers une même scène avec des conditions différentes.
Ne prévois pas toutes les actions possibles : indique les choix importants et les approches raisonnables.
Une autre solution cohérente trouvée par les joueurs doit produire une conséquence logique, pas être refusée pour revenir au chemin prévu.

INDICES
Une information importante ne dépend jamais d’un seul jet ou d’une seule action. Donne plusieurs moyens raisonnables de l’obtenir.

ÉCHEC
Un échec ne doit pas bloquer artificiellement le scénario. Il entraîne plutôt perte de temps, arrivée d’un adversaire, aggravation du phénomène, information incomplète, déplacement d’un acteur, nouvelle menace ou condition moins favorable.

CONFRONTATIONS
Pour les adversaires importants : objectif immédiat, comportement tactique, capacités utiles, limites/faiblesses établies, réaction à l’échec et possibilité de négociation. Pas de fiche complète inutile.

OPTIONNELS
Les éléments OPTIONNELS enrichissent le scénario mais ne conditionnent jamais la réussite.

LIBERTÉ DES JOUEURS
Ne suppose jamais que les agents combattront, suivront exactement les indices ou accepteront une solution proposée.

ILLUSTRATION DE COUVERTURE
La génération de l’illustration est séparée du présent prompt. Ce prompt sert uniquement à produire le scénario complet. Le bouton « Copier prompt illustration » de l’application produit séparément le prompt destiné à la création de la couverture.

À la fin, ajoute « Points à improviser » avec uniquement les détails librement adaptables par le MJ.

Voici le billet A.E.G.I.S. à développer :

--- DÉBUT DU BILLET ---
${billet}
--- FIN DU BILLET ---`
}

function illustrationPrompt(){
 const selected=getSelectedPlayers();
 const chars=selected.map((k,i)=>`JOUEUR ${i+1} — ${CHARACTERS[k].fullName}
${CHARACTERS[k].visual}`).join('\n\n');

 const g=$('genre').value;
 const titleFamily={
  'Pulp / Action':'OPÉRATION',
  'Horreur':'INCIDENT',
  'Enquête':'AFFAIRE',
  'Exploration / Découverte / Lore':'EXPÉDITION',
  'Social / Éthique / Dilemme':'PROTOCOLE',
  'Poétique / Étrange':'PHÉNOMÈNE',
  'Survie':'SAUVETAGE',
  'Thriller / Course contre la montre':'MISSION'
 }[g] || '';

 return `Tu es illustrateur de couvertures pour A.E.G.I.S., un jeu de rôle d’action surnaturelle.

IMPORTANT — CE PROMPT EST LE DEUXIÈME MESSAGE DU PROCESSUS.
Le message immédiatement précédent dans cette conversation contient le scénario A.E.G.I.S. complet qui vient d’être développé ou corrigé.
Ce scénario précédent constitue la SOURCE DE VÉRITÉ NARRATIVE de cette illustration.

Avant de composer l’image, lis et analyse entièrement le scénario du message précédent.
N’invente pas une nouvelle mission et ne reconstruis pas une intrigue à partir des seules informations de ce prompt.
Extrais du scénario précédent les éléments effectivement présents : titre définitif, genre, lieu, personnages, menace ou antagoniste, phénomène ou objet central, atmosphère, enjeux et éléments visuels importants.
Si le scénario précédent a modifié, précisé ou remplacé un élément du billet initial, utilise exclusivement sa version la plus récente.

Le titre affiché sur la couverture doit être le TITRE EXACT DU SCÉNARIO DU MESSAGE PRÉCÉDENT.
Ne réécris pas le titre, ne l’abrège pas et ne le remplace pas par un titre générique.

FAMILLE TYPOGRAPHIQUE INDICATIVE DU GÉNÉRATEUR
Genre sélectionné dans le générateur : ${g}
Désignation graphique associée : ${titleFamily}
Cette désignation sert uniquement à orienter la famille typographique. Le contenu narratif et le titre exact doivent toujours être pris dans le scénario précédent.

PERSONNAGES JOUEURS — RÉFÉRENCE VISUELLE FIXE
Le scénario précédent indique quels agents sont réellement présents. Les descriptions ci-dessous sont les références visuelles fixes de ces personnages et doivent être respectées.
${chars}

DIRECTION ARTISTIQUE FIXE — A.E.G.I.S.
${ART}

COMPOSITION
Créer UNE SEULE véritable couverture verticale de jeu de rôle.
La composition doit être construite à partir du scénario précédent, et non d’une situation inventée.
Les personnages sélectionnés doivent être reconnaissables et conserver exactement leurs caractéristiques physiques, morphologiques, vestimentaires et leurs marqueurs visuels.
Le nombre de personnages représentés doit correspondre exactement au groupe sélectionné : ${selected.length}.
Ne remplacer aucun personnage par un personnage générique.

Construire l’image autour d’une composition graphique forte, avec plusieurs masses narratives fusionnées : lieu ou environnement principal, menace/antagoniste, phénomène/objet ou élément secondaire pertinent du scénario.
Ces masses doivent former UNE composition unique et non trois cases, trois vignettes ou un storyboard.
Les personnages joueurs doivent rester lisibles dans la masse principale de l’image.

Le titre doit être traité comme un véritable élément graphique de couverture pulp : inclinaison, taille, débordement, superposition, déformation, texture, couleur et ornements doivent correspondre au genre.
La typographie peut être volontairement agressive, spectaculaire, irrégulière ou très contrastée avec l’illustration.
Ne pas utiliser une typographie neutre ou générique.

SPOILERS
Le scénario précédent est la source de vérité, mais l’image ne doit pas révéler sa résolution.
Ne montrer ni le véritable coupable s’il est secret, ni une identité secrète, ni un retournement final, ni une information explicitement réservée au MJ.
Un élément de révélation peut être absent, partiellement cadré, symbolisé ou rendu non reconnaissable.

LOGO ET TEXTE
Utiliser impérativement le logo de couverture A.E.G.I.S. défini dans la direction artistique ci-dessous, et non un logo institutionnel générique.
Logo A.E.G.I.S. en haut.
Titre exact du scénario précédent en bas.
Aucune autre écriture dans l’image.

FORMAT
Une seule image.
Illustration de couverture verticale.
Pas de planche, pas de série d’images, pas de storyboard, pas de collage.`;
}
async function copyText(text,button,label){
 try{await navigator.clipboard.writeText(text)}
 catch(e){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
 button.textContent='Copié';setTimeout(()=>button.textContent=label,1400)
}

$('generate').onclick=()=>{try{generateScenario()}catch(e){$('result').classList.remove('hidden');$('story').innerHTML='<h3>Erreur</h3><p>'+esc(e.message)+'</p>'}};
$('copy').onclick=function(){copyText($('story').innerText,this,'Copier le billet')};
$('copyPrompt').onclick=function(){copyText(developmentPrompt($('story').innerText),this,'Copier billet + prompt')};
$('copyImagePrompt').onclick=function(){
 try{copyText(illustrationPrompt(),this,'Copier prompt illustration')}
 catch(e){$('story').innerHTML='<h3>Erreur</h3><p>'+esc(e.message)+'</p>'}
};
$('agents').onchange=updatePlayerSelectors;
updatePlayerSelectors();
</script>
